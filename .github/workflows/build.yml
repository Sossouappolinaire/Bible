name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire la structure Android depuis les fichiers à la racine
        run: |
          mkdir -p app/src/main/java/com/tvkouame/studio
          cp *.java app/src/main/java/com/tvkouame/studio/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.gradle app/build.gradle
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap app/src/main/res/mipmap-anydpi-v26
          cp icon_bg.xml app/src/main/res/drawable/ic_launcher_bg.xml
          cp icon_fg.xml app/src/main/res/drawable/ic_launcher_fg.xml
          cp icon_full.xml app/src/main/res/mipmap/ic_launcher.xml
          cp icon_adaptive.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Compiler l'APK
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TvKouameStudio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
